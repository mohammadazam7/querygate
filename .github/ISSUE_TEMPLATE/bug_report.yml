name: Bug report
description: A query was allowed that should be refused, or refused when it should run
labels: [bug]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: [gate, policy, dialect handling, CLI]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: The exact query, policy, dialect and Python version.
      render: shell
